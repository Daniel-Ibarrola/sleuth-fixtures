name: Fixture — dependency install failure

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dependency-install-failure.yml
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  install-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python (pinned by .python-version)
        run: uv python install

      - name: Install dev dependencies
        run: uv sync --frozen

      - name: Install runtime dependency
        run: uv pip install "requests==2.31.0"

      - name: Test
        run: uv run pytest
